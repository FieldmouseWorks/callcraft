name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  # Format, clippy and the tests run in the flake gate (flake.yml). These
  # fetch the advisory database, which the Nix sandbox can't.
  linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable branch
        with:
          toolchain: stable
      - name: Install supply-chain tools
        run: cargo install cargo-audit cargo-deny --locked
      - name: Audit advisories
        run: cargo audit
      - name: Deny policy
        run: cargo deny check

  windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable branch
        with:
          toolchain: stable
      - name: Test
        run: cargo test --workspace --exclude callcraft-app
      - name: Build desktop shell (release)
        run: cargo build --release -p callcraft-app
      - name: Upload Windows executable
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: callcraft-windows
          path: target/release/callcraft-desktop.exe
          if-no-files-found: error
