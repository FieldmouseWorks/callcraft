name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable branch
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --exclude callcraft-app --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace --exclude callcraft-app
      - name: Install supply-chain tools
        run: cargo install cargo-audit cargo-deny --locked
      - name: Audit advisories
        run: cargo audit
      - name: Deny policy
        run: cargo deny check

  windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable branch
        with:
          toolchain: stable
      - name: Test
        run: cargo test --workspace --exclude callcraft-app
      - name: Build desktop shell (release)
        run: cargo build --release -p callcraft-app
      - name: Upload Windows executable
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: callcraft-windows
          path: target/release/callcraft-desktop.exe
          if-no-files-found: error
