[package]
name = "callcraft-server"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false
description = "Loopback HTTP API and static UI hosting for Callcraft"

[dependencies]
anyhow.workspace = true
base64.workspace = true
axum.workspace = true
callcraft-core = { path = "../callcraft-core" }
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tempfile.workspace = true
zip.workspace = true
time.workspace = true
tokio.workspace = true
url.workspace = true
uuid.workspace = true
keyring-core = "1.0.1"

[target.'cfg(target_os = "linux")'.dependencies]
dbus-secret-service-keyring-store = { version = "1.0.1", features = ["crypto-rust", "vendored"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-native-keyring-store = "1.1.0"

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = "1.0.2"

[dev-dependencies]
callcraft-core = { path = "../callcraft-core" }
reqwest.workspace = true
